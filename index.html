
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sécurité ORUNIA</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 24px;
      padding: 24px;
      background: linear-gradient(135deg, #eaf4ff, #dce6ff);
      color: #17345c;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h2 { margin: 0; }
    #captcha { min-height: 65px; }
    #status { font-size: 14px; }
  </style>

  <script>
    function onloadTurnstileCallback() {
      turnstile.render("#captcha", {
        sitekey: "0x4AAAAAAFwkBRgyA7B3Eu0Q",

        callback: function(token) {
          document.getElementById("status").textContent =
            "Vérification réussie.";

          if (window.Captcha) {
            window.Captcha.postMessage(token);
          }
        },

        "expired-callback": function() {
          document.getElementById("status").textContent =
            "Vérification expirée. Réessaie.";
        },

        "error-callback": function() {
          document.getElementById("status").textContent =
            "Erreur de vérification. Réessaie.";
        }
      });
    }
  </script>

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstileCallback&render=explicit"
    async
    defer>
  </script>
</head>

<body>
  <h2>Sécurité ORUNIA</h2>
  <p>Confirme que tu es bien un utilisateur humain.</p>

  <div id="captcha"></div>
  <p id="status">Chargement de la vérification...</p>
</body>
</html>
